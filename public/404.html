<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>404 - Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #f8fafc;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 6rem;
      margin: 0;
      color: #059669;
    }

    p {
      font-size: 1.2rem;
      margin-top: 0.5rem;
      color: #a1a1aa;
    }

    a {
      margin-top: 1.5rem;
      display: inline-block;
      color: #059669;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #059669;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }

    a:hover {
      background: #059669;
      color: #000000;
    }
  </style>
</head>

<body>
  <div>
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go back home</a>
  </div>
</body>

</html>
