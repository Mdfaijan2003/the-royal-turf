    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        .bento-card {
            transition: all 0.3s ease;
            border: 1px solid #f1f5f9;
        }

        .bento-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgb(0 0 0 / 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fadeUp {
            animation: fadeUp .25s ease;
        }

        /* Active tab indicator */
        #bottom-tabbar #active-tab .tab-icon,
        #bottom-tabbar #active-tab .tab-label {
            color: #0f172a;
        }

        #bottom-tabbar #active-tab .tab-label {
            font-weight: 700;
        }

        #bottom-tabbar #active-tab::after {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            border-radius: 0 0 3px 3px;
            background: #059669;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        /* Bottom tab bar — written as plain CSS (not Tailwind utility classes) so it
       renders correctly even if /css/output.css hasn't been rebuilt yet to include
       new classes like bottom-0, grid-cols-5, or the arbitrary-value utilities. */
        #bottom-tabbar {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 16px -4px rgba(0, 0, 0, 0.06);
        }

        #bottom-tabbar .tabbar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #bottom-tabbar .tab-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 4px;
            text-decoration: none;
        }

        #bottom-tabbar .tab-icon {
            width: 20px;
            height: 20px;
            color: #94a3b8;
        }

        #bottom-tabbar .tab-label {
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
        }

        /* Show the bar only on small screens, same breakpoint as Tailwind's lg (1024px) */
        @media (max-width: 1023px) {
            #bottom-tabbar {
                display: block;
            }
        }

        /* Hidden whenever a modal is open (JS toggles .modal-open on <body>) */
        body.modal-open #bottom-tabbar {
            display: none;
        }
    </style>
</head>
