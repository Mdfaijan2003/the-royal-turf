<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/output.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    .bento-card {
      transition: all 0.3s ease;
      border: 1px solid #f1f5f9;
    }

    .bento-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgb(0 0 0 / 0.05);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    /* Striped background for blocked slots */
    .bg-striped {
      background-image: linear-gradient(45deg, #fee2e2 25%, #fef2f2 25%, #fef2f2 50%, #fee2e2 50%, #fee2e2 75%, #fef2f2 75%, #fef2f2 100%);
      background-size: 20px 20px;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    /* Bottom tab bar — written as plain CSS (not Tailwind utility classes) so it
       renders correctly even if /css/output.css hasn't been rebuilt yet to include
       new classes like bottom-0, grid-cols-5, or the arbitrary-value utilities. */
    #bottom-tabbar {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      box-shadow: 0 -4px 16px -4px rgba(0, 0, 0, 0.06);
    }

    #bottom-tabbar .tabbar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding-bottom: env(safe-area-inset-bottom);
    }

    #bottom-tabbar .tab-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      text-decoration: none;
    }

    #bottom-tabbar .tab-icon {
      width: 20px;
      height: 20px;
      color: #94a3b8;
    }

    #bottom-tabbar .tab-label {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
    }

    /* Show the bar only on small screens, same breakpoint as Tailwind's lg (1024px) */
    @media (max-width: 1023px) {
      #bottom-tabbar {
        display: block;
      }
    }

    /* Hidden whenever a modal is open (JS toggles .modal-open on <body>) */
    body.modal-open #bottom-tabbar {
      display: none;
    }

    /* Modal open/close animation — plain CSS, not Tailwind utility classes
       (translate-y-full/translate-y-0 etc. won't work until output.css is
       rebuilt; these rules work immediately regardless of build state).

       Apply class="rt-modal-backdrop" to the modal's outer fixed wrapper and
       class="rt-modal-panel" to the white panel inside it. To open, add
       "is-open" to the backdrop element; to close, remove it. */
    .rt-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .rt-modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .rt-modal-panel {
      position: relative;
      width: min(95vw, 720px);
      max-height: 90dvh;
      background: #fff;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform .3s ease;
    }

    .rt-modal-backdrop.is-open .rt-modal-panel {
      transform: translateY(0);
    }

    @media (max-width:639px) {

      .rt-modal-backdrop {
        align-items: center;
        padding: 16px;
      }

      .rt-modal-panel {
        width: 95vw;
        max-height: 90dvh;
        border-radius: 24px;
      }

    }

    /* Active tab indicator */
    #bottom-tabbar #active-tab .tab-icon,
    #bottom-tabbar #active-tab .tab-label {
      color: #0f172a;
    }

    #bottom-tabbar #active-tab .tab-label {
      font-weight: 700;
    }

    #bottom-tabbar #active-tab::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: #059669;
    }
  </style>
</head>

       In your JS, mount the modal like this:
         document.getElementById('modal-root').appendChild(modal);
       NOT document.body.appendChild(modal) into some other container. -->
