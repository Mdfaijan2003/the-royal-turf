<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Royal Turf – Slot Control</title>
  <link rel="stylesheet" href="/css/output.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    .bento-card {
      transition: all 0.3s ease;
      border: 1px solid #f1f5f9;
    }

    .bento-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgb(0 0 0 / 0.05);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    /* Striped background for blocked slots */
    .bg-striped {
      background-image: linear-gradient(45deg, #fee2e2 25%, #fef2f2 25%, #fef2f2 50%, #fee2e2 50%, #fee2e2 75%, #fef2f2 75%, #fef2f2 100%);
      background-size: 20px 20px;
    }
  </style>
</head>

<body class="bg-[#F8FAFC] text-[#1e293b] flex">


  <aside class="hidden lg:flex flex-col w-72 bg-white h-screen sticky top-0 border-r border-slate-200 px-6 py-8 z-40">
    <div class="mb-10 px-2">
      <h2 class="text-xl font-extrabold tracking-tighter text-slate-900 flex items-center">
        <span class="bg-yellow-400 w-8 h-8 rounded-lg mr-2 flex items-center justify-center text-xs">RT</span>
        THE ROYAL TURF
      </h2>
    </div>

    <nav class="flex-1 space-y-1">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-2">Management</p>

      <a href="dashboard.html"
        class="nav-link flex items-center space-x-3 text-slate-500 hover:bg-slate-50 p-3 rounded-2xl transition"
        data-page="dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2 7-7 7 7 2 2v8a2 2 0 01-2 2h-3m-4 0V11m-4 0v10" />
        </svg>
        <span class="font-semibold text-sm">Overview</span>
      </a>

      <a href="booking.html"
        class="nav-link flex items-center space-x-3 text-slate-500 hover:bg-slate-50 p-3 rounded-2xl transition"
        data-page="booking">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="font-semibold text-sm">Bookings</span>
      </a>

      <a href="slots.html"
        class="nav-link flex items-center space-x-3 text-slate-500 hover:bg-slate-50 p-3 rounded-2xl transition"
        data-page="slots">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span class="font-semibold text-sm">Slot Control</span>
      </a>

      <a href="finance.html"
        class="nav-link flex items-center space-x-3 text-slate-500 hover:bg-slate-50 p-3 rounded-2xl transition"
        data-page="finance">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span class="font-semibold text-sm">Finance</span>
      </a>

      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-6 mb-3 px-2">Configuration</p>

      <a href="setting.html"
        class="nav-link flex items-center space-x-3 text-slate-500 hover:bg-slate-50 p-3 rounded-2xl transition"
        data-page="setting">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="font-semibold text-sm">Settings</span>
      </a>
    </nav>

    <div class="mt-auto bg-slate-50 p-4 rounded-3xl border border-slate-100">
      <div class="flex items-center space-x-3">
        <img src="https://ui-avatars.com/api/?name=Admin&background=0f172a&color=fff" class="w-10 h-10 rounded-2xl"
          alt="Admin">
        <div>
          <p class="text-xs font-bold">Main Admin</p>
          <p class="text-[10px] text-slate-400">admin@royalturf.com</p>
        </div>
      </div>
    </div>
  </aside>



  <main class="flex-1 min-h-screen relative pb-32 lg:pb-12">

    <header
      class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl px-6 py-6 lg:px-12 flex justify-between items-center border-b border-slate-100/50">
      <h1 class="text-xl font-extrabold text-slate-800 lg:hidden">Slots</h1>
      <div class="hidden lg:flex items-center space-x-2 text-sm font-medium text-slate-400">
        <span>Management</span>
        <span>/</span>
        <span class="text-slate-900 font-bold">Slot Control</span>
      </div>
      <div class="flex items-center space-x-4">
        <button
          class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center border border-red-100">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          Emergency Block
        </button>
      </div>
    </header>

    <div class="p-6 lg:p-12 space-y-8 max-w-7xl mx-auto">

      <section class="flex flex-col xl:flex-row gap-4">

        <div
          class="flex-1 bg-white p-2 rounded-[1.5rem] border border-slate-100 shadow-sm flex items-center justify-between">
          <button class="p-3 hover:bg-slate-50 rounded-2xl text-slate-400 hover:text-slate-900 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="text-center">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Selected Date</p>
            <div class="flex items-center justify-center space-x-2 mt-1 cursor-pointer group">
              <input id="date-picker" type="date"
                class="text-lg font-extrabold text-slate-800 group-hover:text-yellow-600 transition" />
            </div>
          </div>
          <button class="p-3 hover:bg-slate-50 rounded-2xl text-slate-400 hover:text-slate-900 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <div
          class="flex-1 bg-white p-2 rounded-[1.5rem] border border-slate-100 shadow-sm flex gap-2 overflow-x-auto custom-scrollbar pb-1 xl:pb-0">
          <!-- <div class="relative min-w-[140px] flex-1">
            <select
              class="w-full appearance-none bg-slate-50 text-slate-700 py-3 pl-4 pr-10 rounded-2xl text-sm font-bold focus:outline-none focus:ring-2 ring-yellow-400 cursor-pointer">
              <option>All Turfs</option>
              <option>Turf A (5v5)</option>
              <option>Turf B (7v7)</option>
            </select>
            <svg class="w-4 h-4 absolute right-4 top-3.5 text-slate-500 pointer-events-none" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div> -->
          <div class="relative min-w-[140px] flex-1 text-center">
            <select
              class="w-full appearance-none bg-slate-50 text-slate-700 py-3 pl-4 pr-10 rounded-2xl text-sm font-bold focus:outline-none focus:ring-2 ring-yellow-400 cursor-pointer">
              <option>All Status</option>
              <option>Available</option>
              <option>Booked</option>
              <option>Held (Live)</option>
              <option>Blocked</option>
            </select>
            <svg class="w-4 h-4 absolute right-4 top-3.5 text-slate-500 pointer-events-none" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </section>

      <section>
        <h3 class="font-extrabold text-lg mb-6 flex items-center">
          <span>Slots</span>
          <span class="ml-3 px-2 py-0.5 bg-slate-100 rounded text-[10px] text-slate-500 font-bold uppercase">06:00 AM -
            01:00 AM</span>
        </h3>

        <div id="slots-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
          <!-- Slots will be dynamically inserted here -->
      </section>


    </div>
  </main>

  <nav class="lg:hidden fixed bottom-6 inset-x-0 flex justify-center z-50 px-4">
    <div
      class="bg-[#0b0f14]/90 backdrop-blur-md border border-zinc-700/60 rounded-3xl px-4 py-3 flex items-center space-x-2 shadow-2xl">
      <a href="dashboard.html" aria-label="Overview" class="flex flex-col items-center group text-white transition">
        <span
          class="w-10 h-10 rounded-xl inline-flex items-center justify-center bg-gradient-to-br from-[#3b82f6] to-[#8b5cf6] text-white shadow-lg hover:scale-105 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h7V3H3v9z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 3h7v9h-7V3z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 21h7" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h7" />
          </svg>
        </span>
        <span class="mt-1 text-[10px] text-gray-200">Overview</span>
      </a>

      <a href="booking.html" aria-label="Bookings" class="flex flex-col items-center group text-white transition">
        <span
          class="w-10 h-10 rounded-xl inline-flex items-center justify-center bg-gradient-to-br from-[#f472b6] to-[#f59e0b] text-white shadow-lg hover:scale-105 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="3" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
        </span>
        <span class="mt-1 text-[10px] text-gray-200">Bookings</span>
      </a>

      <a href="slots.html" aria-label="Slot Control" class="flex flex-col items-center group text-white transition">
        <span
          class="w-10 h-10 rounded-xl inline-flex items-center justify-center bg-gradient-to-br from-[#10b981] to-[#34d399] text-white shadow-lg hover:scale-105 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h12M4 12h7m-7 6h4" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 6h0" />
          </svg>
        </span>
        <span class="mt-1 text-[10px] text-gray-200">Slot Control</span>
      </a>

      <a href="finance.html" aria-label="Finance" class="flex flex-col items-center group text-white transition">
        <span
          class="w-10 h-10 rounded-xl inline-flex items-center justify-center bg-gradient-to-br from-[#f59e0b] to-[#f472b6] text-white shadow-lg hover:scale-105 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path d="M21 7H5a2 2 0 00-2 2v6h18a2 2 0 002-2V9a2 2 0 00-2-2z" />
            <path d="M3 11h14a3 3 0 013 3v1a2 2 0 01-2 2H3z" />
            <circle cx="16" cy="14" r="1" />
          </svg>
        </span>
        <span class="mt-1 text-[10px] text-gray-200">Finance</span>
      </a>

      <a href="setting.html" aria-label="Setting" aria-current="page"
        class="flex flex-col items-center group text-white transition">
        <span
          class="w-10 h-10 rounded-xl inline-flex items-center justify-center bg-gradient-to-br from-[#334155] to-[#0f172a] text-white shadow-lg ring-2 ring-white/20 hover:scale-105 transform transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 00.3-1.95l-.02-.04a1.7 1.7 0 00-1.3-1.21l-.04-.01a6 6 0 00-1.7-1.23l-.06-.02a1.7 1.7 0 00-2.02-.68l-.05.02a6 6 0 00-1.8.99l-.04.04A1.7 1.7 0 009 9.5l-.02.05a6 6 0 00-.98 1.8l-.02.05a1.7 1.7 0 00.68 2.02l.04.02a6 6 0 001.23 1.7l.01.04a1.7 1.7 0 001.95.3z" />
          </svg>
        </span>
        <span class="mt-1 text-[10px] text-gray-200">Setting</span>
      </a>
    </div>
  </nav>

  <script type="module" src="/js/admin/slots.js"></script>

</body>

</html>
